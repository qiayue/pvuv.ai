# pvuv.ai api worker — api.pvuv.ai  (PROJECT_PLAN.md §10, §18.5)
#   GET /v1/sites/:id/overview | timeseries | breakdown | quality | traffic
#   GET /v1/sites/:id/visitors/:vid/profile   (M1 scope)
#
# All ids are PLACEHOLDERS — see root wrangler.toml for security notes.
# Secrets:
#   wrangler secret put HMAC_KEY  -c workers/api/wrangler.toml   (session auth)
#   wrangler secret put API_TOKEN -c workers/api/wrangler.toml   (external systems)

name = "pvuv-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"
account_id = "PLACEHOLDER_ACCOUNT_ID"

# Custom Domain — wrangler provisions DNS + certificate (see ingest for notes).
routes = [
  { pattern = "api.pvuv.ai", custom_domain = true }
]

kv_namespaces = [
  { binding = "SITE_CONFIG", id = "PLACEHOLDER_KV_SITE_CONFIG_ID" }
]

[vars]
# Where the embed snippet returned by POST /v1/sites points — the same values
# the console uses: f.js is served by the console host, events go to the
# ingest host (keep INGEST_HOST equal to workers/console/wrangler.toml's).
# Leave either empty and POST /v1/sites returns `snippet: null`.
CONSOLE_HOST = "pvuv.ai"
INGEST_HOST = "in.pvuv.ai"

[[d1_databases]]
binding = "DB"
database_name = "pvuv-db"
database_id = "PLACEHOLDER_D1_DATABASE_ID"

[observability]
enabled = true
