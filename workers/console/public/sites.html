<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sites — pvuv.ai</title>
<link rel="stylesheet" href="/console.css">
<style>
  /* portfolio overview (docs/design/portfolio-ui.md, portfolio-mock.html) */
  .topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 10px 20px; min-height: 56px;
    background: rgba(8,9,12,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--p-line); }
  .topbar .brand { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .topbar .brand img.logo { height: 26px; display: block; }
  .search { flex: 0 1 380px; display: flex; align-items: center; gap: 8px; background: var(--p-panel); border: 1px solid var(--p-line-2); border-radius: 9px; padding: 0 10px; min-height: 34px; }
  .search input, .search input[type=search] { -webkit-appearance: none; appearance: none; box-shadow: none; border-radius: 0; flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--p-text); font-size: 13px; padding: 6px 0; }
  .search input:focus-visible { outline: none; }
  .search input[type=search] { border: 0 !important; background: transparent !important; min-height: 0; padding: 6px 0; }
  .search:focus-within { border-color: var(--p-accent); }
  .search input::placeholder { color: var(--p-mut); }
  .search kbd { cursor: pointer; }
  .sp { flex: 1; }
  .menu { position: relative; }
  .menu-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 220px; padding: 6px; background: #12141a; border: 1px solid var(--p-line-2); border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .menu-pop a, .menu-pop button, .menu-pop label { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 9px; border-radius: 7px; border: 0; background: none; color: var(--p-text-2); font-size: 13px; text-align: left; cursor: pointer; }
  .menu-pop a:hover, .menu-pop button:hover, .menu-pop label:hover { background: var(--p-panel-2); text-decoration: none; color: #fff; }
  .menu-pop h5 { margin: 6px 9px 4px; font-size: 11px; color: var(--p-mut); font-weight: 600; letter-spacing: .04em; }
  .menu-pop hr { border: 0; border-top: 1px solid var(--p-line); margin: 5px 2px; }
  .menu-pop select { width: 100%; margin: 2px 0; }

  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 56px); }
  aside.side { border-right: 1px solid var(--p-line); padding: 14px 10px; position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 56px); overflow: auto; }
  aside.side h4 { margin: 16px 8px 6px; font-size: 11px; color: var(--p-mut); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  aside.side h4:first-child { margin-top: 2px; }
  .v { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 7px; background: none; color: var(--p-text-2); font-size: 13px; text-align: left; }
  .v:hover { background: var(--p-panel-2); color: #fff; }
  .v.on { background: var(--p-accent-bg); color: #fff; box-shadow: inset 2px 0 0 var(--p-accent); }
  .v span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v b { font-weight: 500; color: var(--p-mut); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }

  main.pf { max-width: none; margin: 0; padding: 16px 20px 40px; min-width: 0; }
  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .k { position: relative; overflow: hidden; padding: 12px 14px 34px; }
  .k .l { color: var(--p-mut); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k .n { font-size: 21px; font-weight: 650; margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .k .n small { font-size: 12px; margin-left: 7px; font-weight: 600; }
  .k .mini { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; }
  .funnel { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .fs { position: relative; overflow: hidden; padding: 8px 12px 10px; font-size: 12px; color: var(--p-mut); }
  .fs b { display: block; font-size: 17px; color: var(--p-text); font-variant-numeric: tabular-nums; }
  .fs .pb { position: absolute; left: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, #8b7cff, #4cc38a); border-radius: 0 3px 3px 0; }
  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .qchip { border: 1px solid var(--p-line-2); background: var(--p-panel); color: var(--p-text-2); border-radius: 999px; padding: 4px 11px; font-size: 12px; }
  .qchip:hover { border-color: #353a48; color: #fff; }
  .qchip.on { border-color: var(--p-accent); background: var(--p-accent-bg); color: #fff; }
  .qchip b { font-weight: 600; margin-left: 4px; }
  .seg { display: inline-flex; border: 1px solid var(--p-line-2); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; background: var(--p-panel); color: var(--p-text-2); padding: 5px 11px; font-size: 12px; }
  .seg button + button { border-left: 1px solid var(--p-line-2); }
  .seg button.on { background: var(--p-accent-bg); color: #fff; }
  .seg button:disabled { color: #4f5664; }

  .tablewrap { overflow: auto; border: 1px solid var(--p-line); border-radius: var(--p-radius); background: var(--p-panel-grad); box-shadow: var(--p-shadow); }
  table.pt { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  table.pt th { position: sticky; top: 0; z-index: 2; background: #101217; text-align: left; font-weight: 500; color: var(--p-mut); font-size: 12px; padding: 9px 10px;
    border-bottom: 1px solid var(--p-line); white-space: nowrap; user-select: none; }
  table.pt th.sortable { cursor: pointer; } table.pt th.sortable:hover { color: var(--p-text); }
  table.pt th.sorted { color: var(--p-text); }
  table.pt td { padding: 9px 10px; border-bottom: 1px solid var(--p-row); white-space: nowrap; vertical-align: middle; }
  table.pt tbody tr { cursor: pointer; }
  table.pt tbody tr:hover td { background: var(--p-panel-2); }
  table.pt tbody tr.focus td { background: #15142a; }
  table.pt tbody tr.focus td:first-child { box-shadow: inset 2px 0 0 var(--p-accent); }
  table.pt tbody tr.sel td { background: #13122a; }
  table.pt .num { text-align: right; font-variant-numeric: tabular-nums; }
  table.pt td.att-c { white-space: normal; min-width: 170px; max-width: 230px; }
  table.pt td.cb, table.pt th.cb { width: 34px; padding-right: 0; }
  input.pcb { width: 15px; height: 15px; accent-color: var(--p-accent); cursor: pointer; vertical-align: middle; }
  .site { display: flex; align-items: center; gap: 10px; min-width: 210px; }
  .site .tx { min-width: 0; }
  .site .nm { font-weight: 600; color: var(--p-text); }
  .site .dm { color: var(--p-mut); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  .star { color: var(--p-star); margin-right: 3px; }
  .muted2 { color: var(--p-mut); }
  .note { color: var(--p-mut); font-size: 12px; margin-top: 10px; }
  .banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .banner .ic { font-size: 22px; }
  .banner p { margin: 2px 0 0; color: var(--p-mut); font-size: 12.5px; }
  .empty-state { text-align: center; padding: 60px 20px; }
  .empty-state h2 { color: var(--p-text); font-size: 18px; margin: 10px 0 6px; }
  .empty-state p { color: var(--p-mut); margin: 0 0 18px; }
  .loading-state { color: var(--p-mut); padding: 40px; text-align: center; }
  .bulkbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 10px; }
  .bulkbar[hidden] { display: none; }
  .viewhost { min-height: 200px; }

  /* add-site modal (kept flow: template picker + snippet) */
  dialog.pdlg { width: min(640px, 94vw); padding: 0; border: 1px solid var(--p-line-2); border-radius: 14px; background: #101217; color: var(--p-text); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  dialog.pdlg::backdrop { background: rgba(4,5,8,.66); backdrop-filter: blur(3px); }
  .pdlg .dh { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--p-line); }
  .pdlg .dh h3 { margin: 0; font-size: 15px; }
  .pdlg .x { background: none; border: 0; color: var(--p-mut); font-size: 20px; line-height: 1; padding: 2px 8px; border-radius: 6px; }
  .pdlg .x:hover { color: #fff; background: var(--p-panel-2); }
  form.create { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; padding: 16px 18px 18px; }
  form.create label { font-size: 12.5px; color: var(--p-mut); display: block; }
  form.create input, form.create select { width: 100%; margin-top: 4px; background: var(--p-bg); border: 1px solid var(--p-line-2); border-radius: 8px; padding: 7px 9px; color: var(--p-text); }
  form.create .full { grid-column: span 2; }
  form.create .hint { color: var(--p-mut); font-size: 11.5px; }
  form.create .err { color: var(--p-red-text); font-size: 13px; margin: 0; min-height: 1em; }
  .snippet { margin: 0 18px 18px; background: #0b0d11; border: 1px solid #22402e; border-radius: 10px; padding: 14px; }
  .snippet pre { margin: 8px 0 0; white-space: pre-wrap; word-break: break-all; font-size: 12.5px; color: #9ece9e; font-family: var(--mono); }
  .snippet .row { display: flex; gap: 8px; margin-top: 12px; }
  @media (max-width: 1280px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; } aside.side { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--p-line); }
    .funnel { grid-template-columns: repeat(2, minmax(0, 1fr)); } .search { display: none; }
  }
  @media (max-width: 560px) { form.create { grid-template-columns: 1fr; } form.create .full { grid-column: span 1; } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body class="premium">
<script src="/i18n.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/cmdk.js"></script>
<!-- optional modules from the management stream; absent → graceful fallback -->
<script src="/js/drawer.js" defer onerror="void 0"></script>
<script src="/js/views.js" defer onerror="void 0"></script>
<script src="/js/bulk.js" defer onerror="void 0"></script>

<div id="app"><p class="loading-state" data-i18n="loading…">loading…</p></div>

<datalist id="tzlist"></datalist>
<dialog class="pdlg" id="addDlg" aria-labelledby="addTitle">
  <div class="dh"><h3 id="addTitle" data-i18n="Add a site">Add a site</h3><button class="x" type="button" data-close aria-label="Close">×</button></div>
  <form class="create" id="create">
    <div class="full"><label><span data-i18n="Template">Template</span>
      <select id="tpl"><option value="" data-i18n="No template">No template</option></select></label>
      <span class="hint" data-i18n="tpl-pick-help">A template pre-fills the settings below and adds its default funnels.</span></div>
    <div><label><span data-i18n="Site name">Site name</span><input id="name" required placeholder="My Blog" data-i18n-ph="My Blog"></label></div>
    <div><label><span data-i18n="Domains (comma-separated)">Domains (comma-separated)</span><input id="domains" required placeholder="example.com, www.example.com"></label></div>
    <div><label><span data-i18n="Ad protection mode">Ad protection mode</span>
      <!-- stored modes; labels say what each BLOCKS, in ascending strength (see site.html) -->
      <select id="agmode">
        <option value="off" data-i18n="Off">Off</option>
        <option value="balanced" data-i18n="Balanced — bots &amp; crawlers">Balanced — bots &amp; crawlers</option>
        <option value="loose" data-i18n="Aggressive — everything not clean">Aggressive — everything not clean</option>
        <option value="strict" data-i18n="Strictest — clean + interacted">Strictest — clean + interacted</option>
      </select></label></div>
    <div><label><span data-i18n="AdSense client (optional)">AdSense client (optional)</span><input id="adclient" placeholder="ca-pub-1234567890123456"></label></div>
    <div><label><span data-i18n="Timezone">Timezone</span> <span style="color:#e0a34a" data-i18n="(can't be changed later)">(can't be changed later)</span>
      <input id="tz" list="tzlist" autocomplete="off" placeholder="Search timezone…" data-i18n-ph="Search timezone…"></label></div>
    <div><label><span data-i18n="Engagement threshold (seconds)">Engagement threshold (seconds)</span>
      <input id="engaged" type="number" min="1" max="300" value="15" placeholder="15"></label></div>
    <p class="err full" id="err"></p>
    <div class="full"><button type="submit" class="p-btn primary" data-i18n="Create site">Create site</button></div>
  </form>
  <div class="snippet" id="snippet" hidden>
    <b data-i18n="Site created — embed this snippet:">Site created — embed this snippet:</b>
    <pre id="snippetCode"></pre>
    <p class="muted" style="font-size:12px;margin:8px 0 0" data-i18n="snippet-help">data-api must point at your ingest host — adjust it if yours differs. See DEPLOY.md.</p>
    <div class="row"><button type="button" class="p-btn" id="copySnippet" data-i18n="Copy">Copy</button>
      <button type="button" class="p-btn" id="addAnother" data-i18n="Add another">Add another</button>
      <button type="button" class="p-btn primary" data-close data-i18n="Done">Done</button></div>
  </div>
</dialog>

<script type="module">
import { html, render, useState, useEffect, useMemo, useRef, useCallback } from '/vendor/preact-htm.js';

const I18N = window.PVI18N;
const ui = window.pvuvUI;
const { esc, fmt, fill } = ui;
const t = (s) => I18N.t(s);
const te = (s) => esc(t(s));
const tk = (k, en) => I18N.tk(k, en);
const DAY = 86400000;

// ── persistent UI state: URL first (shareable), localStorage second ─────
const LS = { cols: 'pvuv.portfolio.cols', sort: 'pvuv.portfolio.sort', period: 'pvuv.portfolio.period', layout: 'pvuv.portfolio.layout' };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage blocked */ } };
const qp = new URLSearchParams(location.search);
const PERIODS = ['today', 'yesterday', '7d', '30d', '90d', 'this_week', 'last_week', 'this_month', 'last_month', 'this_year'];
const PERIOD_EN = { today: 'Today', yesterday: 'Yesterday', '7d': 'Last 7 days', '30d': 'Last 30 days', '90d': 'Last 90 days', this_week: 'This week', last_week: 'Last week', this_month: 'This month', last_month: 'Last month', this_year: 'This year' };
const QUICK = ['attention', 'new_week', 'no_google', 'ivt_high'];

// ── columns ─────────────────────────────────────────────────────────────
// sort: value used when sorting (desc first for numbers); render: HTML string
const extVal = (s, k) => (s.external ? s.external[k] : null);
const COLS = [
  { id: 'stage', label: 'Stage', sort: (s) => ui.STAGES.indexOf(s.stage), render: (s) => `<span title="${s.stage_since ? esc(t('since') + ' ' + fmt.date(s.stage_since)) : ''}">${ui.stageChip(s.stage)}</span>` },
  { id: 'live', label: 'Live', num: true, sort: (s) => s.days_live, render: (s) => fmt.days(s.days_live) },
  { id: 'uv', label: 'Visitors', num: true, sort: (s) => s.uv, render: (s) => fmt.num(s.uv) },
  { id: 'delta', label: 'Change', num: true, sort: (s) => s.delta_pct ?? -1e9, render: (s) => {
    if (s.delta_pct == null) return `<span class="muted2">${s.days_live < 14 ? te('new') : '–'}</span>`;
    const d = fmt.delta(s.delta_pct); return `<span class="${d.cls}">${esc(d.text)}</span>`;
  } },
  { id: 'trend', label: '14-day trend', render: (s) => ui.areaSpark(s.series, { neg: s.delta_pct != null && s.delta_pct < 0, w: 116, h: 26 }) },
  { id: 'crawl', label: 'Search crawl', render: (s) => ui.engineChips(s.crawl, { late: (s.attention || []).some((a) => a.code === 'crawl_overdue') }) },
  { id: 'organic', label: 'Organic search', num: true, sort: (s) => s.organic_uv, render: (s) => fmt.num(s.organic_uv) },
  { id: 'ai', label: 'AI assistants', num: true, sort: (s) => s.ai_uv, render: (s) => fmt.num(s.ai_uv) },
  { id: 'ivt', label: 'Invalid traffic', num: true, sort: (s) => s.ivt_pct ?? -1, render: (s, c) => `<span class="${s.ivt_pct != null && s.ivt_pct > c.th.ivt_high_pct ? 'dn' : ''}">${s.ivt_pct == null ? '–' : fmt.pct(s.ivt_pct)}</span>` },
  { id: 'health', label: 'Daily health', render: (s) => ui.healthBar(s.health) },
  { id: 'attention', label: 'Needs attention', cls: 'att-c', sort: (s) => (s.attention.length ? 10 - (ui.SEV_RANK[s.attention[0].severity] ?? 9) : 0), render: (s) => ui.attnChip(s.attention) },
  // more metrics (off by default)
  { id: 'pv', label: 'Pageviews', num: true, sort: (s) => s.pv, render: (s) => fmt.num(s.pv) },
  { id: 'uv_prev', label: 'Visitors (previous)', num: true, sort: (s) => s.uv_prev, render: (s) => fmt.num(s.uv_prev) },
  { id: 'created', label: 'Created', num: true, sort: (s) => s.created_at, render: (s) => fmt.date(s.created_at) },
  { id: 'adguard', label: 'Ad protection', sort: (s) => s.adguard_mode, render: (s) => esc(t(s.adguard_mode)) },
  { id: 'last_event', label: 'Last event', num: true, sort: (s) => s.last_event_at || 0, render: (s) => (s.last_event_at ? fmt.ago(s.last_event_at) : '–') },
  // ranking set (cross-site clean-traffic ranking, /api/ranking)
  { id: 'rank', label: 'Rank', num: true, set: 'ranking', sort: (s) => -(s._rank ?? 1e9), render: (s) => (s._rank ? '#' + s._rank : '–') },
  { id: 'ext_clean', label: 'External clean', num: true, set: 'ranking', sort: (s) => s._ext ?? -1, render: (s) => fmt.num(s._ext) },
  { id: 'internal', label: 'Internal (mutual)', num: true, set: 'ranking', sort: (s) => s._int ?? -1, render: (s) => `<span class="muted2">${fmt.num(s._int)}</span>` },
  { id: 'clean_pv', label: 'Clean PV', num: true, set: 'ranking', sort: (s) => s._clean ?? -1, render: (s) => fmt.num(s._clean) },
  { id: 'human', label: 'Human', num: true, set: 'ranking', sort: (s) => s._human ?? -1, render: (s) => (s._human == null ? '–' : s._human + '%') },
  // external data (only offered when some site has it)
  { id: 'revenue', label: 'Revenue', num: true, ext: true, sort: (s) => extVal(s, 'revenue_usd') ?? -1, render: (s) => fmt.usd(extVal(s, 'revenue_usd')) },
  { id: 'rpm', label: 'RPM', num: true, ext: true, sort: (s) => extVal(s, 'rpm_usd') ?? -1, render: (s) => fmt.usd(extVal(s, 'rpm_usd')) },
  { id: 'adsense', label: 'Ad network', ext: true, sort: (s) => s.external?.adsense?.status || '', render: (s) => (s.external?.adsense ? ui.chip(t(s.external.adsense.status), s.external.adsense.status === 'ready' || s.external.adsense.status === 'approved' ? 'green' : 'amber') : '–') },
];
const COL_BY = Object.fromEntries(COLS.map((c) => [c.id, c]));
const PRESETS = {
  // external columns (revenue …) are listed but only shown when some site has external data
  overview: ['stage', 'live', 'uv', 'delta', 'trend', 'crawl', 'organic', 'ivt', 'revenue', 'rpm', 'adsense', 'health', 'attention'],
  ranking: ['rank', 'uv', 'ext_clean', 'internal', 'clean_pv', 'pv', 'human', 'ivt', 'trend'],
  growth: ['stage', 'uv', 'uv_prev', 'delta', 'trend', 'organic', 'ai', 'pv'],
};

// ── data ─────────────────────────────────────────────────────────────────
async function guard(r) { if (r.status === 401) { location.href = '/login.html'; throw new Error('auth'); } return r; }
async function fetchPortfolio(period, compare, fresh) {
  const r = await guard(await fetch(`/api/portfolio?period=${encodeURIComponent(period)}&compare=${compare ? 'previous' : 'none'}${fresh ? '&fresh=1' : ''}`));
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
async function fetchRanking(period) {
  try {
    const r = await guard(await fetch(`/api/ranking?period=${encodeURIComponent(period)}`));
    return r.ok ? ((await r.json()).sites || []) : [];
  } catch { return []; }
}

const startOfWeek = () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };
const sevSort = (a, b) => {
  const sa = a.attention.length ? ui.SEV_RANK[a.attention[0].severity] ?? 9 : 99, sb = b.attention.length ? ui.SEV_RANK[b.attention[0].severity] ?? 9 : 99;
  return sa - sb || b.uv - a.uv;
};
function quickMatch(id, s, th) {
  if (id === 'attention') return s.status === 'active' && s.attention.length > 0;
  if (id === 'new_week') return s.status === 'active' && s.created_at >= startOfWeek();
  if (id === 'no_google') return s.status === 'active' && s.uv > 0 && !s.crawl.google;
  if (id === 'ivt_high') return s.status === 'active' && s.ivt_pct != null && s.ivt_pct > th.ivt_high_pct;
  return true;
}
function viewMatch(view, s) {
  if (view === 'all') return s.status !== 'archived';
  if (view === 'archived') return s.status === 'archived';
  if (view === 'attention') return s.status === 'active' && s.attention.length > 0;
  if (view === 'starred') return s.starred;
  if (view.startsWith('stage:')) return s.stage === view.slice(6);
  if (view.startsWith('tag:')) return s.status !== 'archived' && s.tags.includes(view.slice(4));
  if (view.startsWith('cohort:')) return s.status !== 'archived' && s.cohort === view.slice(7);
  return true;
}
function textMatch(q, s) {
  if (!q) return true;
  q = q.toLowerCase();
  return s.name.toLowerCase().includes(q) || s.site_id.toLowerCase().includes(q) || s.domains.some((d) => d.toLowerCase().includes(q)) || s.tags.some((d) => d.toLowerCase().includes(q));
}

// ── components ───────────────────────────────────────────────────────────
const Raw = ({ h, tag = 'span', cls }) => html`<${tag} class=${cls} dangerouslySetInnerHTML=${{ __html: h }} />`;
const STAGE_DOT = { setup: '#5d6676', awaiting_crawl: 'var(--p-amber)', crawled: 'var(--p-blue)', organic: 'var(--p-violet)', growing: 'var(--p-green)', declining: 'var(--p-red)', archived: '#3a3f4b' };

function Kpi({ label, value, delta, series, neg }) {
  const d = delta || { text: '', cls: '' };
  const mini = useMemo(() => ui.areaSpark(series || [], { w: 300, h: 30, fluid: true, neg, label }), [series, neg, label]);
  return html`<div class="k p-card"><div class="l">${label}</div><div class="n">${value}${d.text ? html`<small class=${d.cls}>${d.text}</small>` : null}</div>
    <${Raw} cls="mini" tag="div" h=${mini} /></div>`;
}

function Menu({ label, children, cls = 'p-btn', title }) {
  const [open, setOpen] = useState(false);
  const ref = useRef();
  useEffect(() => {
    if (!open) return;
    const off = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const esc = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', off); document.addEventListener('keydown', esc);
    return () => { document.removeEventListener('mousedown', off); document.removeEventListener('keydown', esc); };
  }, [open]);
  return html`<div class="menu" ref=${ref}><button class=${cls} type="button" title=${title} aria-haspopup="true" aria-expanded=${open} onClick=${() => setOpen(!open)}>${label}</button>
    ${open ? html`<div class="menu-pop" onClick=${(e) => e.stopPropagation()}>${typeof children === 'function' ? children(() => setOpen(false)) : children}</div>` : null}</div>`;
}

function App() {
  const [, setTick] = useState(0);
  const [period, setPeriod] = useState(qp.get('period') || lsGet(LS.period, '7d'));
  const [compare, setCompare] = useState(qp.get('compare') !== 'none');
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  const [view, setView] = useState(qp.get('view') || 'all');
  const [quick, setQuick] = useState(qp.get('quick') || '');
  const [search, setSearch] = useState(qp.get('q') || '');
  const [sort, setSort] = useState(() => {
    const s = qp.get('sort'); if (s) { const [id, dir] = s.split(':'); return { id, dir: dir === 'asc' ? 'asc' : 'desc' }; }
    return lsGet(LS.sort, { id: 'uv', dir: 'desc' });
  });
  const [cols, setCols] = useState(() => (qp.get('cols') ? qp.get('cols').split(',') : lsGet(LS.cols, PRESETS.overview)).filter((c) => COL_BY[c]));
  const [layout, setLayout] = useState(qp.get('layout') || lsGet(LS.layout, 'table'));
  const [selected, setSelected] = useState(() => new Set());
  const [focus, setFocus] = useState(-1);
  const [ranking, setRanking] = useState(null);
  const [brand, setBrand] = useState({ name: 'pvuv.ai' });
  const [modules, setModules] = useState({});
  const viewHost = useRef(); const bulkHost = useRef(); const bulkMounted = useRef(false);
  const searchRef = useRef();

  // language switch → re-render everything
  useEffect(() => { const f = () => setTick((x) => x + 1); document.addEventListener('pvuv:lang', f); return () => document.removeEventListener('pvuv:lang', f); }, []);
  // optional modules load with `defer` → re-check once the page has loaded
  useEffect(() => {
    const check = () => setModules({ drawer: !!window.pvuvDrawer, views: window.pvuvViews || null, bulk: !!window.pvuvBulk });
    check(); window.addEventListener('load', check); document.addEventListener('pvuv:modules', check);
    return () => { window.removeEventListener('load', check); document.removeEventListener('pvuv:modules', check); };
  }, []);
  useEffect(() => {
    fetch('/api/home').then((r) => (r.ok ? r.json() : null)).then((b) => {
      if (!b) return;
      setBrand(b);
      document.title = ((b.name || '').trim() || 'pvuv.ai') + ' — ' + t('Sites');
      if (b.favicon) { let l = document.querySelector('link[rel="icon"]'); if (!l) { l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); } l.href = b.favicon; }
    }).catch(() => {});
  }, []);

  const load = useCallback((fresh) => {
    setErr('');
    return fetchPortfolio(period, compare, fresh).then((d) => { setData(d); window.pvuvCmdk?.setSites(d.sites); window.pvuvPortfolio = d; })
      .catch((e) => { if (e.message !== 'auth') setErr(e.message || 'failed'); });
  }, [period, compare]);
  useEffect(() => { setData((d) => (d ? { ...d, _stale: true } : d)); load(false); }, [load]);
  // reload after a write by another module (drawer / bulk): `pvuv:changed`
  useEffect(() => { const f = () => load(true); document.addEventListener('pvuv:changed', f); return () => document.removeEventListener('pvuv:changed', f); }, [load]);

  const needRanking = cols.some((c) => COL_BY[c]?.set === 'ranking') || sort.id && COL_BY[sort.id]?.set === 'ranking';
  useEffect(() => { if (needRanking) fetchRanking(period).then(setRanking); }, [needRanking, period]);

  // URL + storage sync
  useEffect(() => {
    const p = new URLSearchParams();
    if (period !== '7d') p.set('period', period);
    if (!compare) p.set('compare', 'none');
    if (view !== 'all') p.set('view', view);
    if (quick) p.set('quick', quick);
    if (search) p.set('q', search);
    if (!(sort.id === 'uv' && sort.dir === 'desc')) p.set('sort', sort.id + ':' + sort.dir);
    if (cols.join(',') !== PRESETS.overview.join(',')) p.set('cols', cols.join(','));
    if (layout !== 'table') p.set('layout', layout);
    const qs = p.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
    lsSet(LS.period, period); lsSet(LS.sort, sort); lsSet(LS.cols, cols); lsSet(LS.layout, layout);
  }, [period, compare, view, quick, search, sort, cols, layout]);

  const th = data?.thresholds || { ivt_high_pct: 20, growth_min_uv: 1000 };
  const sites = useMemo(() => {
    if (!data) return [];
    if (!ranking) return data.sites;
    const by = new Map(ranking.map((r, i) => [r.site_id, { ...r, rank: i + 1 }]));
    return data.sites.map((s) => { const r = by.get(s.site_id); return r ? { ...s, _rank: r.rank, _ext: r.external_pv, _int: r.internal_pv, _clean: r.clean_pv, _human: r.quality_score } : s; });
  }, [data, ranking]);
  const hasExternal = sites.some((s) => s.external);
  const visibleCols = cols.filter((c) => COL_BY[c] && (!COL_BY[c].ext || hasExternal));

  const rows = useMemo(() => {
    let r = sites.filter((s) => viewMatch(view, s) && (!quick || quickMatch(quick, s, th)) && textMatch(search, s));
    const col = COL_BY[sort.id];
    if ((view === 'attention' || quick === 'attention') && (!col || sort.id === 'uv' && sort.dir === 'desc')) r = r.slice().sort(sevSort);
    else if (col?.sort) {
      const dir = sort.dir === 'asc' ? 1 : -1;
      r = r.slice().sort((a, b) => { const x = col.sort(a), y = col.sort(b); return (x < y ? -1 : x > y ? 1 : 0) * dir || b.uv - a.uv; });
    } else if (sort.id === 'name') {
      const dir = sort.dir === 'asc' ? 1 : -1;
      r = r.slice().sort((a, b) => a.name.localeCompare(b.name) * dir);
    }
    return r;
  }, [sites, view, quick, search, sort, th]);

  const ctx = useMemo(() => ({
    period, t, te, esc, fmt, ui, thresholds: th,
    reload: () => load(true),
    open: (s) => openSite(s),
    navigate: (s) => { window.pvuvCmdk?.recordRecent(s.site_id); location.href = '/site.html?id=' + encodeURIComponent(s.site_id); },
  }), [period, th, load]);
  function openSite(s) {
    if (window.pvuvDrawer) window.pvuvDrawer.open(s, ctx);
    else ctx.navigate(s);
  }

  // cards / heatmap from the management stream
  useEffect(() => {
    if (layout === 'table' || !viewHost.current) return;
    const fn = window.pvuvViews?.[layout];
    if (fn) fn(viewHost.current, rows, ctx); else viewHost.current.innerHTML = `<p class="loading-state">${te('This view is not available yet.')}</p>`;
  }, [layout, rows, ctx, modules]);

  // keyboard: j/k move, Enter opens, x selects, Esc clears
  const rowsRef = useRef(rows); rowsRef.current = rows;
  const focusRef = useRef(focus); focusRef.current = focus;
  useEffect(() => {
    const onKey = (e) => {
      const tag = document.activeElement?.tagName;
      if (e.metaKey || e.ctrlKey || e.altKey || tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || document.querySelector('dialog[open]') || document.querySelector('.cmdk:not([hidden])')) return;
      const n = rowsRef.current.length; if (!n) return;
      if (e.key === 'j' || e.key === 'ArrowDown' && e.shiftKey === false && focusRef.current >= 0) { e.preventDefault(); setFocus((f) => Math.min(n - 1, f + 1)); }
      else if (e.key === 'k' || e.key === 'ArrowUp' && focusRef.current >= 0) { e.preventDefault(); setFocus((f) => Math.max(0, f - 1)); }
      else if (e.key === 'Enter' && focusRef.current >= 0) { e.preventDefault(); const s = rowsRef.current[focusRef.current]; if (s) (e.shiftKey ? ctx.navigate(s) : openSite(s)); }
      else if (e.key === 'x' && focusRef.current >= 0) { e.preventDefault(); toggleSel(rowsRef.current[focusRef.current].site_id); }
      else if (e.key === 'Escape') { setSelected(new Set()); setFocus(-1); }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [ctx]);
  useEffect(() => { document.querySelector('tr.focus')?.scrollIntoView({ block: 'nearest' }); }, [focus]);
  useEffect(() => { setFocus(-1); }, [view, quick, search]);

  function toggleSel(id) { setSelected((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; }); }
  const selRef = useRef(selected); selRef.current = selected;
  function bulk() {
    if (!window.pvuvBulk || !bulkHost.current) return;
    bulkHost.current.hidden = false;
    if (!bulkMounted.current) {
      window.pvuvBulk.mount(bulkHost.current, () => [...selRef.current], () => { setSelected(new Set()); load(true); });
      bulkMounted.current = true;
    }
  }
  function sortBy(id) { setSort((s) => (s.id === id ? { id, dir: s.dir === 'desc' ? 'asc' : 'desc' } : { id, dir: COL_BY[id]?.num || id === 'attention' ? 'desc' : 'asc' })); }
  // the attention queue always opens in its own order: severity, then visitors
  function pickView(v) { setView(v); setQuick(''); if (v === 'attention') setSort({ id: 'uv', dir: 'desc' }); }

  // ── render ──
  if (err && !data) return html`${Top()}<div class="loading-state">${t('failed')}: ${err} <button class="p-btn" onClick=${() => load(true)}>${t('Retry')}</button></div>`;
  if (!data) return html`${Top()}<p class="loading-state">${t('loading…')}</p>`;

  const counts = (() => {
    const c = { all: 0, attention: 0, starred: 0, archived: 0, tags: new Map(), cohort: 0 };
    const thisCohort = sites.find((s) => s.created_at >= startOfWeek())?.cohort;
    for (const s of sites) {
      if (s.status === 'archived') { c.archived++; continue; }
      c.all++; if (s.attention.length) c.attention++; if (s.starred) c.starred++;
      for (const g of s.tags) c.tags.set(g, (c.tags.get(g) || 0) + 1);
      if (thisCohort && s.cohort === thisCohort) c.cohort++;
    }
    c.thisCohort = thisCohort;
    return c;
  })();

  function Top() {
    const logo = brand.logo_light || brand.logo_dark;
    return html`<div class="topbar">
      <a class="brand" href="/sites.html" style="color:inherit">${logo ? html`<img class="logo" src=${logo} alt=${brand.name || 'pvuv.ai'} />` : (brand.name || 'pvuv.ai')}</a>
      <label class="search"><input ref=${searchRef} type="search" value=${search} placeholder=${t('Search sites, domains, tags…')} aria-label=${t('Search sites, domains, tags…')}
        onInput=${(e) => setSearch(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Escape') { setSearch(''); e.target.blur(); } else if (e.key === 'Enter' && rows[0]) openSite(rows[0]); }} />
        <kbd title=${t('Jump to a site (⌘K or /)')} onClick=${(e) => { e.preventDefault(); window.pvuvCmdk?.open(); }}>⌘K</kbd></label>
      <div class="sp"></div>
      <select class="p-btn" aria-label=${t('Date range')} value=${period} onChange=${(e) => setPeriod(e.target.value)}>
        ${PERIODS.map((p) => html`<option value=${p}>${t(PERIOD_EN[p])}</option>`)}</select>
      <button class=${'p-btn' + (compare ? ' on' : '')} type="button" aria-pressed=${compare} onClick=${() => setCompare(!compare)}>${t('Compare: previous period')}</button>
      <button class="p-btn" type="button" id="bulkBtn" disabled=${!modules.bulk} title=${modules.bulk ? (selected.size ? fill(t('{n} selected'), { n: selected.size }) : t('Select rows first')) : t('Bulk actions are not available yet.')} onClick=${bulk}>
        ${t('Bulk actions')}${selected.size ? html` <span class="pchip accent">${selected.size}</span>` : null}</button>
      <button class="p-btn primary" type="button" onClick=${openAdd}>＋ ${t('New site')}</button>
      <a class="p-btn" href="/settings.html" title=${t('Settings')} aria-label=${t('Settings')}>⚙</a>
      <${Menu} label="⋯" title=${t('More')}>
        <h5>${t('Language')}</h5>
        <div style="padding:0 6px"><select class="p-btn" style="width:100%" value=${I18N.lang} onChange=${(e) => I18N.setLang(e.target.value)}>${I18N.langs.map((l) => html`<option value=${l.code}>${l.label}</option>`)}</select></div>
        <hr />
        <a href="/health.html">${t('Self-check')}</a>
        <button type="button" onClick=${async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/login.html'; }}>${t('Sign out')}</button>
      <//>
    </div>`;
  }

  const T = data.totals;
  const ser = (k) => T.series.map((x) => ({ uv: x[k] ?? 0 }));
  const dPct = (a, b) => (compare ? fmt.delta(fmt.change(a, b)) : null);

  const F = data.funnel;
  const fpct = (n) => (F.total ? Math.round((n / F.total) * 100) : 0);
  const allSetup = counts.all > 0 && sites.filter((s) => s.status === 'active').every((s) => s.stage === 'setup');

  const quickCount = (id) => sites.filter((s) => quickMatch(id, s, th)).length;
  const QUICK_EN = { attention: 'Needs attention', new_week: 'Launched this week', no_google: 'Traffic, no Google crawl', ivt_high: 'Invalid traffic > {n}%' };
  const allChecked = rows.length > 0 && rows.every((s) => selected.has(s.site_id));

  return html`
  ${Top()}
  <div class="layout">
    <aside class="side" aria-label=${t('Views')}>
      <h4>${t('Views')}</h4>
      <button class=${'v' + (view === 'all' ? ' on' : '')} onClick=${() => pickView('all')}><span>${t('All sites')}</span><b>${counts.all}</b></button>
      <button class=${'v' + (view === 'attention' ? ' on' : '')} onClick=${() => pickView('attention')}><span><i class="dot" style="background:var(--p-red)"></i>${t('Needs attention')}</span><b>${counts.attention}</b></button>
      <button class=${'v' + (view === 'starred' ? ' on' : '')} onClick=${() => pickView('starred')}><span><span class="star">★</span> ${t('Starred')}</span><b>${counts.starred}</b></button>
      <h4>${t('Lifecycle')}</h4>

        <span><i class="dot" style=${'background:' + STAGE_DOT[s]}></i>${ui.stageLabel(s, true)}</span><b>${data.stage_counts[s] || 0}</b></button>`)}
      <h4>${t('Groups / tags')}</h4>
      ${counts.thisCohort ? html`<button class=${'v' + (view === 'cohort:' + counts.thisCohort ? ' on' : '')} onClick=${() => pickView('cohort:' + counts.thisCohort)} title=${counts.thisCohort}><span>${t('Launch batch · this week')}</span><b>${counts.cohort}</b></button>` : null}
      ${[...counts.tags.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([g, n]) => html`<button class=${'v' + (view === 'tag:' + g ? ' on' : '')} onClick=${() => pickView('tag:' + g)}><span>${g}</span><b>${n}</b></button>`)}
      <button class=${'v' + (view === 'archived' ? ' on' : '')} onClick=${() => pickView('archived')}><span>${t('Archived')}</span><b>${counts.archived}</b></button>
    </aside>
    <main class="pf" aria-busy=${data._stale ? 'true' : 'false'} style=${data._stale ? 'opacity:.6;transition:opacity .2s' : ''}>
      ${sites.length === 0 ? html`
        <div class="p-card empty-state">
          <div style="font-size:34px">🛰️</div>
          <h2>${t('No sites yet')}</h2>
          <p>${t('Add your first site to get its tracking snippet. Numbers appear here as soon as it receives a visit.')}</p>
          <button class="p-btn primary" onClick=${openAdd}>＋ ${t('New site')}</button>
          <p style="margin-top:14px;font-size:12px">${t('Just deployed?')} <a href="/health.html">${t('Run the self-check ↗')}</a></p>
        </div>` : html`
      ${allSetup ? html`<div class="p-card banner"><span class="ic">🧩</span><div><b>${fill(t('{n} sites are waiting for their first visit'), { n: counts.all })}</b>
        <p>${t('Embed the snippet on each site (open a site for its snippet). Stages, trends and crawl signals fill in as data arrives.')}</p></div></div>` : null}
      <section class="kpis" aria-label=${t('Totals')}>
        <${Kpi} label=${t('Visitors')} value=${fmt.num(T.uv)} delta=${dPct(T.uv, T.uv_prev)} series=${ser('uv')} />
        <${Kpi} label=${t('Pageviews')} value=${fmt.num(T.pv)} delta=${dPct(T.pv, T.pv_prev)} series=${ser('pv')} />
        <${Kpi} label=${t('Invalid traffic share')} value=${fmt.pct(T.ivt_pct, 1)} delta=${ivtD} series=${ser('ivt_pct')} neg=${true} />
        <${Kpi} label=${t('Organic search visitors')} value=${fmt.num(T.organic_uv)} delta=${dPct(T.organic_uv, T.organic_uv_prev)} series=${ser('organic_uv')} />
        <${Kpi} label=${t('From AI assistants')} value=${fmt.num(T.ai_uv)} delta=${dPct(T.ai_uv, T.ai_uv_prev)} series=${ser('ai_uv')} />
        <${Kpi} label=${t('Top 10% of sites share')} value=${fmt.share(T.top10_share)} series=${ser('uv')} />

        <span class="sp"></span>
        ${layout === 'table' ? html`<${Menu} label=${t('Columns') + ' ▾'}>${() => html`

          <hr /><h5>${t('Columns')}</h5>
          ${COLS.filter((c) => !c.ext || hasExternal).map((c) => html`<label><input type="checkbox" class="pcb" checked=${cols.includes(c.id)}
            onChange=${(e) => setCols(e.target.checked ? COLS.map((x) => x.id).filter((x) => x === c.id || cols.includes(x)) : cols.filter((x) => x !== c.id))} /> ${t(c.label)}</label>`)}`}<//>` : null}
        <div class="seg" role="group" aria-label=${t('Layout')}>
          ${['table', 'cards', 'heatmap'].map((l) => html`<button type="button" class=${layout === l ? 'on' : ''} aria-pressed=${layout === l}
            disabled=${l !== 'table' && !modules.views?.[l]} title=${l !== 'table' && !modules.views?.[l] ? t('This view is not available yet.') : ''}
            onClick=${() => setLayout(l)}>${t({ table: 'Table', cards: 'Cards', heatmap: 'Heatmap' }[l])}</button>`)}
        </div>
      </div>
      <div class="bulkbar p-card" ref=${bulkHost} hidden></div>
      ${layout !== 'table' && modules.views?.[layout] ? html`<div class="viewhost" ref=${viewHost}></div>` : html`
      <div class="tablewrap">
        <table class="pt">
          <thead><tr>
            <th class="cb"><input type="checkbox" class="pcb" aria-label=${t('Select all')} checked=${allChecked}
              onChange=${(e) => setSelected(e.target.checked ? new Set(rows.map((s) => s.site_id)) : new Set())} /></th>
            <th class=${'sortable' + (sort.id === 'name' ? ' sorted' : '')} onClick=${() => sortBy('name')}>${t('Site')}${sort.id === 'name' ? (sort.dir === 'desc' ? ' ▾' : ' ▴') : ''}</th>
            ${visibleCols.map((id) => { const c = COL_BY[id]; return html`<th class=${[c.num ? 'num' : '', c.sort ? 'sortable' : '', sort.id === id ? 'sorted' : ''].join(' ')}
              aria-sort=${sort.id === id ? (sort.dir === 'asc' ? 'ascending' : 'descending') : undefined}
              onClick=${c.sort ? () => sortBy(id) : undefined}>${t(c.label)}${sort.id === id ? (sort.dir === 'desc' ? ' ▾' : ' ▴') : ''}</th>`; })}
          </tr></thead>
          <tbody>
            ${rows.map((s, i) => html`<tr key=${s.site_id} class=${(i === focus ? 'focus ' : '') + (selected.has(s.site_id) ? 'sel' : '')}
              onClick=${() => { setFocus(i); openSite(s); }}>
              <td class="cb" onClick=${(e) => e.stopPropagation()}><input type="checkbox" class="pcb" aria-label=${t('Select') + ' ' + s.name} checked=${selected.has(s.site_id)} onChange=${() => toggleSel(s.site_id)} /></td>
              <td><div class="site"><${Raw} h=${ui.avatar(s.name, s.site_id)} /><div class="tx">
                <div><span class="nm">${s.starred ? html`<span class="star" aria-label=${t('Starred')}>★</span>` : null}<a href=${'/site.html?id=' + encodeURIComponent(s.site_id)} style="color:inherit" onClick=${(e) => { if (!e.metaKey && !e.ctrlKey) { e.preventDefault(); e.stopPropagation(); setFocus(i); openSite(s); } }}>${s.name}</a></span>
                  ${s.tags.slice(0, 2).map((g) => html`<span class="ptag">${g}</span>`)}${s.tags.length > 2 ? html`<span class="ptag">+${s.tags.length - 2}</span>` : null}</div>
                <div class="dm">${s.domains[0] || s.site_id}${s.domains.length > 1 ? ' +' + (s.domains.length - 1) : ''}</div></div></div></td>
              ${visibleCols.map((id) => { const c = COL_BY[id]; return html`<td class=${(c.num ? 'num ' : '') + (c.cls || '')}><${Raw} h=${c.render(s, { th })} /></td>`; })}
            </tr>`)}
            ${rows.length === 0 ? html`<tr><td colspan=${visibleCols.length + 2} class="loading-state">${t('No sites match this view.')}</td></tr>` : null}
          </tbody>
        </table>
      </div>`}
      <p class="note">${fill(t('{n} sites'), { n: rows.length })} · ${t('j / k to move, Enter to open, x to select, / or ⌘K to jump to a site.')}
        ${' '}${fill(t('Updated {ago}.'), { ago: fmt.ago(data.generated_at) })} <a href="#" onClick=${(e) => { e.preventDefault(); load(true); }}>${t('Refresh')}</a></p>
      `}
    </main>
  </div>`;
}

// ── add-site modal (kept flow: template picker + snippet) ────────────────
const dlg = document.getElementById('addDlg');
const $ = (id) => document.getElementById(id);
const TZ_LIST = (() => {
  try { return Intl.supportedValuesOf('timeZone'); } catch {
    return ['UTC', 'Asia/Shanghai', 'Asia/Hong_Kong', 'Asia/Tokyo', 'Asia/Singapore', 'Asia/Kolkata', 'Europe/London', 'Europe/Paris', 'Europe/Berlin',
      'America/New_York', 'America/Chicago', 'America/Los_Angeles', 'America/Sao_Paulo', 'Australia/Sydney'];
  }
})();
const browserTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return 'UTC'; } })();
let me = null, templates = [];
async function prepAdd() {
  if (!me) {
    $('tzlist').innerHTML = TZ_LIST.map((z) => `<option value="${esc(z)}"></option>`).join('');
    try { me = await (await guard(await fetch('/api/me'))).json(); } catch { me = {}; }
    try { templates = ((await (await guard(await fetch('/api/templates'))).json()).templates) || []; } catch { templates = []; }
    $('tpl').innerHTML = `<option value="">${te('No template')}</option>` + templates.map((x) => `<option value="${esc(x.template_id)}">${esc(x.name)}</option>`).join('');
    $('tpl').closest('div').hidden = !templates.length;
  }
  const def = me.timezone && me.timezone !== 'UTC' ? me.timezone : (TZ_LIST.includes(browserTz) ? browserTz : 'UTC');
  if (!$('tz').value) $('tz').value = def;
}
function openAdd() {
  $('create').hidden = false; $('snippet').hidden = true; $('err').textContent = '';
  prepAdd();
  I18N.applyStatic(dlg);
  dlg.showModal();
  setTimeout(() => $('name').focus(), 0);
}
window.pvuvOpenAdd = openAdd;
$('tpl').addEventListener('change', () => {
  const x = templates.find((y) => y.template_id === $('tpl').value);
  if (!x) return;
  if (x.timezone) $('tz').value = x.timezone;
  if (x.adguard_mode) $('agmode').value = x.adguard_mode;
  $('adclient').value = x.adclient || '';
  if (x.engaged_seconds != null) $('engaged').value = x.engaged_seconds;
});
dlg.addEventListener('click', (e) => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); });
dlg.addEventListener('close', () => { if (!$('snippet').hidden) document.dispatchEvent(new CustomEvent('pvuv:changed')); });
$('addAnother').addEventListener('click', () => { $('create').reset(); $('tz').value = ''; prepAdd(); $('create').hidden = false; $('snippet').hidden = true; $('name').focus(); document.dispatchEvent(new CustomEvent('pvuv:changed')); });
$('copySnippet').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('snippetCode').textContent); $('copySnippet').textContent = t('Copied'); } catch { /* no clipboard */ } });
$('create').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    name: $('name').value,
    domains: $('domains').value.split(',').map((d) => d.trim()).filter(Boolean),
    adguard_mode: $('agmode').value,
    adclient: $('adclient').value.trim() || undefined,
    timezone: $('tz').value,
    engaged_seconds: parseInt($('engaged').value, 10) || 15,
  };
  if ($('tpl').value) body.template = $('tpl').value;
  const r = await guard(await fetch('/api/sites', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }));
  const d = await r.json();
  if (!r.ok) { $('err').textContent = d.error || t('failed'); return; }
  $('err').textContent = '';
  // f.js is served by this console; events go to the ingest host (deployment
  // config INGEST_HOST, sibling-subdomain guess only for older deployments)
  const ingestHost = (me && me.ingest_host) || 'in.' + location.hostname.replace(/^(www|console)\./, '');
  const attrs = [`data-site="${d.site_id}"`, `data-api="https://${ingestHost}"`];
  if (d.adguard_mode !== 'off') attrs.push(`data-adguard="${d.adguard_mode}"`);
  if (d.adclient) attrs.push(`data-adclient="${d.adclient}"`);
  $('snippetCode').textContent = `<script defer src="${location.origin}/f.js"\n        ${attrs.join('\n        ')}><\/script>`;
  $('copySnippet').textContent = t('Copy');
  $('create').hidden = true; $('snippet').hidden = false;
});

I18N.applyStatic();
render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
