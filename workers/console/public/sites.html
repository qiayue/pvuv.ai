<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sites — pvuv.ai</title>
<link rel="stylesheet" href="/console.css">
<style>
  /* portfolio overview — docs/design/portfolio-mock-light.html */
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
  main.pf { max-width: none; margin: 0; padding: 26px 32px 40px; min-width: 0; }
  h1.title { font-size: 30px; font-weight: 650; letter-spacing: -.01em; margin: 0 0 14px; color: var(--text); }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .sp { flex: 1; }
  .sync { color: var(--mut); font-size: 12.5px; white-space: nowrap; }
  .syncbtn { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; font-size: 14px; background: none; border: 0; color: var(--text); padding: 4px 2px; }
  .syncbtn:disabled svg { animation: spin 1s linear infinite; }
  .caption { color: var(--mut); font-size: 13px; margin: 18px 0 10px; }
  .caption button { background: none; border: 0; padding: 0; color: var(--link); font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  .sec { margin-top: 16px; padding: 18px 20px; }
  .sec h3 { margin: 0 0 14px; font-size: 15px; font-weight: 500; color: var(--text-2); }
  .chart-h { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .chart-h h3 { margin: 0; flex: 1; }
  .xaxis { display: flex; justify-content: space-between; color: var(--mut); font-size: 12px; padding: 0 6px 0 46px; }
  .legend { color: var(--mut); font-size: 12.5px; margin-top: 6px; }
  .tbl { margin-top: 16px; overflow: hidden; }
  .tbl .th { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tbl .th h3 { margin: 0; font-size: 15px; font-weight: 500; color: var(--text-2); flex: 1; }
  .search { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0 10px; width: 240px; display: flex; gap: 7px; align-items: center; color: var(--mut); background: var(--surface); }
  .search input[type=search] { flex: 1; min-width: 0; border: 0 !important; background: transparent !important; outline: none; padding: 6px 0; min-height: 0; font-size: 13px; color: var(--text); -webkit-appearance: none; appearance: none; }
  .search:focus-within { border-color: var(--accent); }
  .search kbd { cursor: pointer; border: 0; background: none; padding: 0; }
  .tscroll { overflow-x: auto; }
  table.pt { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.pt th { font-weight: 500; color: var(--mut); font-size: 12.5px; text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; background: var(--surface); }
  table.pt th.sortable { cursor: pointer; } table.pt th.sortable:hover, table.pt th.sorted { color: var(--text); }
  table.pt td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; vertical-align: middle; }
  table.pt tbody tr:last-child td { border-bottom: 0; }
  table.pt tbody tr { cursor: pointer; }
  table.pt tbody tr:hover td { background: #fafafa; }
  table.pt tbody tr.focus td { background: var(--accent-soft); }
  table.pt tbody tr.sel td { background: #f5f8ff; }
  table.pt .num { text-align: right; font-variant-numeric: tabular-nums; }
  table.pt td.att-c { white-space: normal; min-width: 170px; max-width: 260px; }
  table.pt td.cb, table.pt th.cb { width: 24px; padding-right: 0; }
  input.pcb { width: 15px; height: 15px; min-height: 0; accent-color: var(--text); cursor: pointer; vertical-align: middle; }
  .site { display: flex; align-items: center; gap: 10px; min-width: 200px; }
  .site .nm { font-weight: 550; color: var(--text); }
  .site .nm a { color: inherit; }
  .site .dm { color: var(--mut); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  .note { color: var(--mut); font-size: 12.5px; padding: 10px 18px; border-top: 1px solid var(--line); }
  .note a { color: var(--link); }
  .banner { display: flex; align-items: center; gap: 14px; padding: 14px 18px; margin-bottom: 14px; }
  .banner p { margin: 2px 0 0; color: var(--mut); font-size: 13px; }
  .banner svg.i { width: 20px; height: 20px; color: var(--text-2); }
  .empty-state { text-align: center; padding: 64px 20px; }
  .empty-state h2 { color: var(--text); font-size: 18px; margin: 8px 0 6px; }
  .empty-state p { color: var(--mut); margin: 0 0 18px; }
  .empty-state svg.i { width: 28px; height: 28px; color: var(--mut); }
  .loading-state { color: var(--mut); padding: 40px; text-align: center; }
  .bulkhost:empty { display: none; }
  .bulkhost { padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .viewhost { padding: 14px 18px; min-height: 200px; }
  .menu { position: relative; }
  .menu-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 220px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(24,24,27,.10); }
  .menu-pop a, .menu-pop button, .menu-pop label { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 9px; border-radius: 7px; border: 0; background: none; color: var(--text); font-size: 13px; text-align: left; cursor: pointer; }
  .menu-pop a:hover, .menu-pop button:hover, .menu-pop label:hover { background: var(--surface-2); text-decoration: none; }
  .menu-pop h5 { margin: 6px 9px 4px; font-size: 11.5px; color: var(--mut); font-weight: 500; }
  .menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }
  .menu-pop select { width: 100%; }
  select.stagesel { min-height: 32px; font-size: 13px; }

  /* add-site modal (kept flow: template picker + snippet) */
  dialog.pdlg { width: min(640px, 94vw); padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: 0 12px 40px rgba(24,24,27,.14); }
  dialog.pdlg::backdrop { background: rgba(24,24,27,.28); }
  .pdlg .dh { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .pdlg .dh h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .pdlg .x { background: none; border: 0; color: var(--mut); font-size: 20px; line-height: 1; padding: 2px 8px; border-radius: 6px; }
  .pdlg .x:hover { color: var(--text); background: var(--surface-2); }
  form.create { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; padding: 16px 18px 18px; }
  form.create label { font-size: 13px; color: var(--text-2); display: block; }
  form.create input, form.create select { width: 100%; margin-top: 4px; }
  form.create .full { grid-column: span 2; }
  form.create .hint { color: var(--mut); font-size: 12px; }
  form.create .err { color: var(--down); font-size: 13px; margin: 0; min-height: 1em; }
  .snippet { margin: 0 18px 18px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; }
  .snippet pre { margin: 8px 0 0; white-space: pre-wrap; word-break: break-all; font-size: 12.5px; color: var(--text); font-family: var(--mono); }
  .snippet .row { display: flex; gap: 8px; margin-top: 12px; }
  @media (max-width: 1280px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .pbars .r { grid-template-columns: 130px 1fr 70px 50px; } .pbars .r > :last-child { display: none; } }
  @media (max-width: 900px) { main.pf { padding: 18px 14px 30px; } .search { width: 100%; } }
  @media (max-width: 560px) { form.create { grid-template-columns: 1fr; } form.create .full { grid-column: span 1; } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<script src="/i18n.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/cmdk.js"></script>
<script src="/js/shell.js"></script>
<!-- optional modules from the management stream; absent → graceful fallback -->
<script src="/js/drawer.js" defer onerror="void 0"></script>
<script src="/js/views.js" defer onerror="void 0"></script>
<script src="/js/bulk.js" defer onerror="void 0"></script>

<div id="app"><p class="loading-state" data-i18n="loading…">loading…</p></div>

<datalist id="tzlist"></datalist>
<dialog class="pdlg" id="addDlg" aria-labelledby="addTitle">
  <div class="dh"><h3 id="addTitle" data-i18n="Add a site">Add a site</h3><button class="x" type="button" data-close aria-label="Close">×</button></div>
  <form class="create" id="create">
    <div class="full"><label><span data-i18n="Template">Template</span>
      <select id="tpl"><option value="" data-i18n="No template">No template</option></select></label>
      <span class="hint" data-i18n="tpl-pick-help">A template pre-fills the settings below and adds its default funnels.</span></div>
    <div><label><span data-i18n="Site name">Site name</span><input id="name" required placeholder="My Blog" data-i18n-ph="My Blog"></label></div>
    <div><label><span data-i18n="Domains (comma-separated)">Domains (comma-separated)</span><input id="domains" required placeholder="example.com, www.example.com"></label></div>
    <div><label><span data-i18n="Ad protection mode">Ad protection mode</span>
      <!-- stored modes; labels say what each BLOCKS, in ascending strength (see site.html) -->
      <select id="agmode">
        <option value="off" data-i18n="Off">Off</option>
        <option value="balanced" data-i18n="Balanced — bots &amp; crawlers">Balanced — bots &amp; crawlers</option>
        <option value="loose" data-i18n="Aggressive — everything not clean">Aggressive — everything not clean</option>
        <option value="strict" data-i18n="Strictest — clean + interacted">Strictest — clean + interacted</option>
      </select></label></div>
    <div><label><span data-i18n="AdSense client (optional)">AdSense client (optional)</span><input id="adclient" placeholder="ca-pub-1234567890123456"></label></div>
    <div><label><span data-i18n="Timezone">Timezone</span> <span style="color:#e0a34a" data-i18n="(can't be changed later)">(can't be changed later)</span>
      <input id="tz" list="tzlist" autocomplete="off" placeholder="Search timezone…" data-i18n-ph="Search timezone…"></label></div>
    <div><label><span data-i18n="Engagement threshold (seconds)">Engagement threshold (seconds)</span>
      <input id="engaged" type="number" min="1" max="300" value="15" placeholder="15"></label></div>
    <p class="err full" id="err"></p>
    <div class="full"><button type="submit" class="p-btn primary" data-i18n="Create site">Create site</button></div>
  </form>
  <div class="snippet" id="snippet" hidden>
    <b data-i18n="Site created — embed this snippet:">Site created — embed this snippet:</b>
    <pre id="snippetCode"></pre>
    <p class="muted" style="font-size:12px;margin:8px 0 0" data-i18n="snippet-help">data-api must point at your ingest host — adjust it if yours differs. See DEPLOY.md.</p>
    <div class="row"><button type="button" class="p-btn" id="copySnippet" data-i18n="Copy">Copy</button>
      <button type="button" class="p-btn" id="addAnother" data-i18n="Add another">Add another</button>
      <button type="button" class="p-btn primary" data-close data-i18n="Done">Done</button></div>
  </div>
</dialog>
<script type="module">
import { html, render, useState, useEffect, useMemo, useRef, useCallback } from '/vendor/preact-htm.js';

const I18N = window.PVI18N;
const ui = window.pvuvUI;
const { esc, fmt, fill } = ui;
const t = (s) => I18N.t(s);
const te = (s) => esc(t(s));

// ── line icons (16px, stroke) ────────────────────────────────────────────
const ICON = {
  overview: 'M4 19V9M10 19V5M16 19v-7M22 19H2',
  alert: 'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',
  star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
  globe: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18',
  search: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5',
  layers: 'M12 3l9 4.5-9 4.5L3 7.5zM3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5',
  flask: 'M9 3h6M10 3v6L4 19a1 1 0 0 0 .9 1.5h14.2A1 1 0 0 0 20 19l-6-10V3',
  dollar: 'M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',
  plug: 'M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0zM12 16v5',
  key: 'M7.5 11a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zM10.7 12.3L21 2M16 7l3 3M19 4l2 2',
  gear: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z',
  plus: 'M12 5v14M5 12h14',
  home: 'M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  down: 'M6 9l6 6 6-6',
  refresh: 'M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2M21 4v5h-5M3 20v-5h5',
  eye: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  page: 'M4 4h16v16H4zM4 9h16M9 20V9',
  spark: 'M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z',
  ivt: 'M19 5L5 19M6.5 4a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM17.5 15a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',
  more: 'M5 12h.01M12 12h.01M19 12h.01',
  code: 'M8 6l-6 6 6 6M16 6l6 6-6 6',
};
const Icon = ({ n }) => html`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d=${ICON[n]} /></svg>`;

// ── persistent UI state: URL first (shareable), localStorage second ─────
const LS = { cols: 'pvuv.portfolio.cols', sort: 'pvuv.portfolio.sort', period: 'pvuv.portfolio.period', layout: 'pvuv.portfolio.layout' };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage blocked */ } };
const PERIODS = ['today', 'yesterday', '7d', '30d', '90d', 'this_week', 'last_week', 'this_month', 'last_month', 'this_year'];
const PERIOD_EN = { today: 'Today', yesterday: 'Yesterday', '7d': 'Last 7 days', '30d': 'Last 30 days', '90d': 'Last 90 days', this_week: 'This week', last_week: 'Last week', this_month: 'This month', last_month: 'Last month', this_year: 'This year' };
const QUICK = ['attention', 'new_week', 'no_google', 'ivt_high'];
const TABS = ['overview', 'sites', 'lifecycle'];
const LIFE_ORDER = ['growing', 'organic', 'crawled', 'awaiting_crawl', 'setup', 'declining'];

/** every piece of view state the URL can carry (shareable; the shell links set it) */
function urlState() {
  const qp = new URLSearchParams(location.search);
  const sortQ = qp.get('sort');
  const preset = qp.get('preset');
  return {
    tab: TABS.includes(qp.get('tab')) ? qp.get('tab') : 'overview',
    period: qp.get('period') || lsGet(LS.period, '7d'),
    compare: qp.get('compare') !== 'none',
    view: ['attention', 'starred'].includes(qp.get('view')) ? qp.get('view') : 'all',
    stage: qp.get('stage') || '',
    tag: qp.get('tag') || '',
    quick: qp.get('quick') || '',
    search: qp.get('q') || '',
    sort: sortQ ? { id: sortQ.split(':')[0], dir: sortQ.split(':')[1] === 'asc' ? 'asc' : 'desc' } : (qp.has('view') || preset ? { id: 'uv', dir: 'desc' } : lsGet(LS.sort, { id: 'uv', dir: 'desc' })),
    cols: (preset && PRESETS_REF[preset] ? PRESETS_REF[preset] : qp.get('cols') ? qp.get('cols').split(',') : lsGet(LS.cols, PRESETS_REF.overview)).filter((c) => COL_BY_REF[c]),
    layout: qp.get('layout') || lsGet(LS.layout, 'table'),
  };
}
let PRESETS_REF = {}, COL_BY_REF = {};

// ── columns ─────────────────────────────────────────────────────────────
const extVal = (s, k) => (s.external ? s.external[k] : null);
const COLS = [
  { id: 'stage', label: 'Stage', sort: (s) => ui.STAGES.indexOf(s.stage), render: (s) => ui.stageChip(s.stage, s.stage_since ? t('since') + ' ' + fmt.date(s.stage_since) : '') },
  { id: 'live', label: 'Live', num: true, sort: (s) => s.days_live, render: (s) => `<span class="m">${esc(fmt.days(s.days_live))}</span>` },
  { id: 'uv', label: 'Visitors', num: true, sort: (s) => s.uv, render: (s) => fmt.num(s.uv) },
  { id: 'delta', label: 'Change', num: true, sort: (s) => s.delta_pct ?? -1e9, render: (s) => {
    if (s.delta_pct == null) return `<span class="m">${s.days_live < 14 ? te('new') : '–'}</span>`;
    const r = Math.round(s.delta_pct);
    return `<span class="${r >= 0 ? 'up' : 'down'}">${r > 0 ? '+' : ''}${r}%</span>`;
  } },
  { id: 'trend', label: 'Last 14 days', render: (s) => ui.sparkline(s.series, { neg: s.delta_pct != null && s.delta_pct < 0 }) },
  { id: 'crawl', label: 'Search crawl', render: (s) => ui.engineChips(s.crawl, { late: (s.attention || []).some((a) => a.code === 'crawl_overdue') }) },
  { id: 'organic', label: 'Organic search', num: true, sort: (s) => s.organic_uv, render: (s) => fmt.num(s.organic_uv) },
  { id: 'ai', label: 'AI assistants', num: true, sort: (s) => s.ai_uv, render: (s) => fmt.num(s.ai_uv) },
  { id: 'ivt', label: 'Invalid traffic', num: true, sort: (s) => s.ivt_pct ?? -1, render: (s, c) => `<span class="${s.ivt_pct != null && s.ivt_pct > c.th.ivt_pct ? 'down' : ''}">${s.ivt_pct == null ? '–' : fmt.pct(s.ivt_pct)}</span>` },
  { id: 'health', label: 'Daily health', render: (s) => ui.healthBar(s.health) },
  { id: 'attention', label: 'Needs attention', cls: 'att-c', sort: (s) => (s.attention.length ? 10 - (ui.SEV_RANK[s.attention[0].severity] ?? 9) : 0), render: (s) => ui.attnChip(s.attention) },
  // more metrics (off by default)
  { id: 'pv', label: 'Pageviews', num: true, sort: (s) => s.pv, render: (s) => fmt.num(s.pv) },
  { id: 'uv_prev', label: 'Visitors (previous)', num: true, sort: (s) => s.uv_prev, render: (s) => fmt.num(s.uv_prev) },
  { id: 'first_crawl', label: 'First crawl', num: true, sort: (s) => s.first_search_crawl_at || 0, render: (s) => (s.first_search_crawl_at ? fmt.date(s.first_search_crawl_at) : '–') },
  { id: 'created', label: 'Created', num: true, sort: (s) => s.created_at, render: (s) => fmt.date(s.created_at) },
  { id: 'adguard', label: 'Ad protection', sort: (s) => s.adguard_mode, render: (s) => esc(t(s.adguard_mode)) },
  { id: 'last_event', label: 'Last event', num: true, sort: (s) => s.last_event_at || 0, render: (s) => (s.last_event_at ? fmt.ago(s.last_event_at) : '–') },
  // ranking set (cross-site clean-traffic ranking, /api/ranking)
  { id: 'rank', label: 'Rank', num: true, set: 'ranking', sort: (s) => -(s._rank ?? 1e9), render: (s) => (s._rank ? '#' + s._rank : '–') },
  { id: 'ext_clean', label: 'External clean', num: true, set: 'ranking', sort: (s) => s._ext ?? -1, render: (s) => fmt.num(s._ext) },
  { id: 'internal', label: 'Internal (mutual)', num: true, set: 'ranking', sort: (s) => s._int ?? -1, render: (s) => `<span class="m">${fmt.num(s._int)}</span>` },
  { id: 'clean_pv', label: 'Clean PV', num: true, set: 'ranking', sort: (s) => s._clean ?? -1, render: (s) => fmt.num(s._clean) },
  { id: 'human', label: 'Human', num: true, set: 'ranking', sort: (s) => s._human ?? -1, render: (s) => (s._human == null ? '–' : s._human + '%') },
  // external data (only offered when some site has it)
  { id: 'revenue', label: 'Revenue', num: true, ext: true, sort: (s) => extVal(s, 'revenue_usd') ?? -1, render: (s) => fmt.usd(extVal(s, 'revenue_usd')) },
  { id: 'rpm', label: 'RPM', num: true, ext: true, sort: (s) => extVal(s, 'rpm_usd') ?? -1, render: (s) => fmt.usd(extVal(s, 'rpm_usd')) },
  { id: 'adsense', label: 'Ad network', ext: true, sort: (s) => s.external?.adsense?.status || '', render: (s) => (s.external?.adsense ? `<span class="stage"><i style="background:${['ready', 'approved', 'ok'].includes(s.external.adsense.status) ? 'var(--up)' : 'var(--warn)'}"></i>${te(s.external.adsense.status)}</span>` : '–') },
];
const COL_BY = Object.fromEntries(COLS.map((c) => [c.id, c]));
COL_BY_REF = COL_BY;
const PRESETS = {
  // external columns are listed but only shown when some site has external data
  overview: ['stage', 'live', 'uv', 'delta', 'trend', 'crawl', 'organic', 'ivt', 'revenue', 'rpm', 'adsense', 'attention'],
  crawl: ['stage', 'live', 'crawl', 'first_crawl', 'organic', 'ai', 'attention'],
  quality: ['stage', 'uv', 'pv', 'ivt', 'health', 'adguard', 'attention'],
  revenue: ['stage', 'uv', 'delta', 'revenue', 'rpm', 'adsense', 'attention'],
  ranking: ['rank', 'uv', 'ext_clean', 'internal', 'clean_pv', 'pv', 'human', 'ivt', 'trend'],
  growth: ['stage', 'uv', 'uv_prev', 'delta', 'trend', 'organic', 'ai', 'pv'],
  // experiments are per site (the site preview / dashboard): the table just lists sites to open
  experiments: ['stage', 'uv', 'delta', 'trend', 'organic', 'attention'],
};
PRESETS_REF = PRESETS;
const PRESET_EN = { overview: 'Overview', crawl: 'Indexing & crawlers', quality: 'Traffic quality', revenue: 'Revenue', ranking: 'Ranking · clean traffic', growth: 'Growth', experiments: 'Experiments' };

// ── data ─────────────────────────────────────────────────────────────────
async function guard(r) { if (r.status === 401) { location.href = '/login.html'; throw new Error('auth'); } return r; }
async function fetchPortfolio(period, compare, fresh) {
  const r = await guard(await fetch(`/api/portfolio?period=${encodeURIComponent(period)}&compare=${compare ? 'previous' : 'none'}${fresh ? '&fresh=1' : ''}`));
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
async function fetchRanking(period) {
  try { const r = await guard(await fetch(`/api/ranking?period=${encodeURIComponent(period)}`)); return r.ok ? ((await r.json()).sites || []) : []; } catch { return []; }
}

const startOfWeek = () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); };
const sevSort = (a, b) => {
  const sa = a.attention.length ? ui.SEV_RANK[a.attention[0].severity] ?? 9 : 99, sb = b.attention.length ? ui.SEV_RANK[b.attention[0].severity] ?? 9 : 99;
  return sa - sb || b.uv - a.uv;
};
function quickMatch(id, s, th) {
  if (id === 'attention') return s.attention.length > 0;
  if (id === 'new_week') return s.created_at >= startOfWeek();
  if (id === 'no_google') return s.uv > 0 && !s.crawl.google;
  if (id === 'ivt_high') return s.ivt_pct != null && s.ivt_pct > th.ivt_pct;
  return true;
}
function textMatch(q, s) {
  if (!q) return true;
  q = q.toLowerCase();
  return s.name.toLowerCase().includes(q) || s.site_id.toLowerCase().includes(q) || s.domains.some((d) => d.toLowerCase().includes(q)) || s.tags.some((d) => d.toLowerCase().includes(q));
}
/** totals for a client-side subset (tag filter): sums of the per-site rows */
function aggregate(list, compare) {
  const sum = (k) => list.reduce((a, s) => a + (s[k] || 0), 0);
  const pv = sum('pv'), pvp = sum('pv_prev');
  const ivt = list.reduce((a, s) => a + (s.ivt_pct || 0) * s.pv / 100, 0);
  return { uv: sum('uv'), uv_prev: compare ? sum('uv_prev') : null, pv, pv_prev: compare ? pvp : null, ivt_pct: pv ? Math.round((ivt / pv) * 1000) / 10 : null, ivt_pct_prev: null,
    organic_uv: sum('organic_uv'), organic_uv_prev: null, ai_uv: sum('ai_uv'), ai_uv_prev: null };
}
const isoWeek = (day) => { const d = new Date(day + 'T00:00:00Z'); const dow = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - dow); return d.toISOString().slice(0, 10); };

// ── components ───────────────────────────────────────────────────────────
const Raw = ({ h, tag = 'span', cls }) => html`<${tag} class=${cls} dangerouslySetInnerHTML=${{ __html: h }} />`;

function Kpi({ icon, label, value, delta }) {
  return html`<div class="p-card kpi"><div class="h"><${Icon} n=${icon} /><span>${label}</span>${delta?.text ? html`<span class=${'d ' + delta.cls}>${delta.text}</span>` : null}</div><div class="v">${value}</div></div>`;
}
const signed = (d, opts = {}) => {
  if (d == null || !isFinite(d)) return null;
  const r = Math.abs(d) >= 10 ? Math.round(d) : Math.round(d * 10) / 10;
  const good = opts.invert ? r <= 0 : r >= 0;
  return { text: (r > 0 ? '+' : '') + r + (opts.unit || '%'), cls: r === 0 ? '' : good ? 'up' : 'down' };
};

function Menu({ label, children, cls = 'p-btn', title, up }) {
  const [open, setOpen] = useState(false);
  const ref = useRef();
  useEffect(() => {
    if (!open) return;
    const off = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const key = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', off); document.addEventListener('keydown', key);
    return () => { document.removeEventListener('mousedown', off); document.removeEventListener('keydown', key); };
  }, [open]);
  return html`<div class="menu" ref=${ref}><button class=${cls} type="button" title=${title} aria-label=${title} aria-haspopup="true" aria-expanded=${open} onClick=${() => setOpen(!open)}>${label}</button>
    ${open ? html`<div class=${'menu-pop' + (up ? ' up' : '')}>${typeof children === 'function' ? children(() => setOpen(false)) : children}</div>` : null}</div>`;
}

function App() {
  const [, setTick] = useState(0);

    else if (cols.join(',') !== PRESETS.overview.join(',')) p.set('cols', cols.join(','));
    if (layout !== 'table') p.set('layout', layout);
    const qs = p.toString();

    document.dispatchEvent(new CustomEvent('pvuv:urlchange'));

  }, [data, ranking]);
  const hasExternal = sites.some((s) => s.external);
  const visibleCols = cols.filter((c) => COL_BY[c] && (!COL_BY[c].ext || hasExternal));

  // scope = tag filter over the active (or archived) sites; everything else narrows the table
  const scope = useMemo(() => sites.filter((s) => (stage === 'archived' ? s.status === 'archived' : s.status !== 'archived')
    && (!tag || s.tags.includes(tag) || s.cohort === tag)), [sites, stage, tag]);
  const rows = useMemo(() => {

    const col = COL_BY[sort.id];

    else if (col?.sort) r = r.slice().sort((a, b) => { const x = col.sort(a), y = col.sort(b); return (x < y ? -1 : x > y ? 1 : 0) * dir || b.uv - a.uv; });
    else if (sort.id === 'name') r = r.slice().sort((a, b) => a.name.localeCompare(b.name) * dir);

  const selRef = useRef(selected); selRef.current = selected;

  // keyboard: j/k move, Enter opens (Shift+Enter: full dashboard), x selects, Esc clears

  // ── chrome ──

  const Toolbar = html`<div class="toolbar">

  const Funnel = html`<section class="p-card sec"><h3>${t('Launch funnel')}</h3><div class="pbars">
    ${[['total', 'Total sites'], ['has_data', 'Receiving data'], ['google_crawled', 'Crawled by Google'], ['organic', 'Organic traffic'], ['weekly_1000', 'Weekly visitors > {n}']].filter(([k]) => F[k] != null).map(([k, l]) => html`

        <span class="num">${fmt.num(F[k])}</span><span class="num m">${F.total ? Math.round((F[k] / F.total) * 100) : 0}%</span><span></span></div>`)}</div></section>`;

  // daily chart: metric × day/week; grey bars = sites launched that day
  const chartPts = (() => {
    let pts;
    if (tag) {
      // per-site series cover the last 14 days (visitors only)
      const m = new Map();
      for (const s of activeScope) for (const p of s.series) m.set(p.day, (m.get(p.day) || 0) + p.uv);
      const launched = new Map();
      for (const s of activeScope) { const d = new Date(s.created_at).toISOString().slice(0, 10); launched.set(d, (launched.get(d) || 0) + 1); }
      pts = [...m.keys()].sort().map((day) => ({ day, uv: m.get(day), pv: null, ivt_pct: null, launched_per_day: launched.get(day) || 0 }));
    } else pts = data.totals.series.map((x) => ({ ...x }));
    if (gran === 'week') {
      const w = new Map();
      for (const p of pts) {
        const k = isoWeek(p.day); const a = w.get(k) || { day: k, uv: 0, pv: 0, ivtn: 0, launched_per_day: 0 };
        a.uv += p.uv || 0; a.pv += p.pv || 0; a.ivtn += ((p.ivt_pct || 0) * (p.pv || 0)) / 100; a.launched_per_day += p.launched_per_day || 0; w.set(k, a);
      }

    }

    return pts.map((p) => ({ label: p.day.slice(5), v: p[key] ?? 0, bar: p.launched_per_day || 0, barTitle: fill(t('{n} sites launched'), { n: p.launched_per_day || 0 }) }));
  })();
  const chartTitle = { uv: 'Daily visitors', pv: 'Daily pageviews', ivt: 'Daily invalid traffic share' }[metric];
  const ticks = chartPts.length <= 10 ? chartPts : chartPts.filter((_, i) => i % Math.ceil(chartPts.length / 10) === 0);
  const Chart = html`<section class="p-card sec">
    <div class="chart-h"><h3>${t(gran === 'week' ? chartTitle.replace('Daily', 'Weekly') : chartTitle)}</h3>
      <div class="seg" role="group" aria-label=${t('Metric')}>
        ${[['uv', 'Visitors'], ['pv', 'Pageviews'], ['ivt', 'Invalid traffic']].map(([k, l]) => html`<button type="button" class=${metric === k ? 'on' : ''} aria-pressed=${metric === k} disabled=${tag && k !== 'uv'} onClick=${() => setMetric(k)}>${t(l)}</button>`)}</div>
      <div class="seg" role="group" aria-label=${t('Interval')}>
        ${[['day', 'By day'], ['week', 'By week']].map(([k, l]) => html`<button type="button" class=${gran === k ? 'on' : ''} aria-pressed=${gran === k} onClick=${() => setGran(k)}>${t(l)}</button>`)}</div></div>
    <${Raw} tag="div" h=${ui.lineChart(chartPts, { h: 240, label: t(chartTitle), fmtY: metric === 'ivt' ? (v) => Math.round(v) + '%' : undefined, fmtV: metric === 'ivt' ? (v) => fmt.pct(v, 1) : undefined })} />
    <div class="xaxis">${ticks.map((p) => html`<span>${p.label}</span>`)}</div>
    <div class="legend">${tag ? t('Visitors of the filtered sites over the last 14 days. ') : ''}${t('Grey bars: sites launched that day.')}</div>
  </section>`;

  const quickCount = (id) => scope.filter((s) => quickMatch(id, s, th)).length;
  const QUICK_EN = { attention: 'Needs attention', new_week: 'Launched this week', no_google: 'Traffic, no Google crawl', ivt_high: 'Invalid traffic > {n}%' };
  const allChecked = rows.length > 0 && rows.every((s) => selected.has(s.site_id));
  const TableCard = html`<section class="p-card tbl" aria-label=${t('Sites')}>
    <div class="th"><h3>${view === 'attention' ? t('Needs attention') : view === 'starred' ? t('Starred') : t('Sites')}</h3>
      <label class="search"><${Icon} n="search" /><input ref=${searchRef} type="search" value=${search} placeholder=${t('Search sites or domains')} aria-label=${t('Search sites or domains')}
        onInput=${(e) => setSearch(e.target.value)} onKeyDown=${(e) => { if (e.key === 'Escape') { setSearch(''); e.target.blur(); } else if (e.key === 'Enter' && rows[0]) openSite(rows[0]); }} />
        <kbd class="k" title=${t('Jump to a site (⌘K or /)')} onClick=${(e) => { e.preventDefault(); window.pvuvCmdk?.open(); }}>⌘K</kbd></label>
      <div class="seg" role="group" aria-label=${t('Quick filters')}>
        <button type="button" class=${!quick ? 'on' : ''} aria-pressed=${!quick} onClick=${() => setQuick('')}>${t('All')}</button>
        ${QUICK.map((id) => { const n = quickCount(id); return id !== 'attention' && id !== 'new_week' && !n && quick !== id ? null : html`<button type="button" class=${quick === id ? 'on' : ''} aria-pressed=${quick === id}
          onClick=${() => { setQuick(quick === id ? '' : id); if (id === 'attention' && quick !== id) setSort({ id: 'uv', dir: 'desc' }); }}>${fill(t(QUICK_EN[id]), { n: th.ivt_pct })} <span class="n">${n}</span></button>`; })}</div>
      <select class="stagesel" aria-label=${t('Stage')} value=${stage} onChange=${(e) => setStage(e.target.value)}>
        <option value="">${t('All stages')}</option>${ui.STAGES.map((s) => html`<option value=${s}>${ui.stageLabel(s)}${s === 'archived' ? ` (${counts.archived})` : ''}</option>`)}</select>
      ${layout === 'table' ? html`<${Menu} label=${html`${t('Columns')} <${Icon} n="down" />`}>${() => html`
        <h5>${t('Column sets')}</h5>
        ${Object.keys(PRESETS).filter((p) => p !== 'revenue' || hasExternal).map((p) => html`<button type="button" onClick=${() => { setCols(PRESETS[p]); if (p === 'ranking') setSort({ id: 'rank', dir: 'asc' }); }}>${t(PRESET_EN[p])}</button>`)}
        <hr /><h5>${t('Columns')}</h5>
        ${COLS.filter((c) => !c.ext || hasExternal).map((c) => html`<label><input type="checkbox" class="pcb" checked=${cols.includes(c.id)}
          onChange=${(e) => setCols(e.target.checked ? COLS.map((x) => x.id).filter((x) => x === c.id || cols.includes(x)) : cols.filter((x) => x !== c.id))} /> ${t(c.label)}</label>`)}`}<//>` : null}
      <div class="seg" role="group" aria-label=${t('Layout')}>
        ${['table', 'cards', 'heatmap'].map((l) => html`<button type="button" class=${layout === l ? 'on' : ''} aria-pressed=${layout === l}
          disabled=${l !== 'table' && !modules.views?.[l]} title=${l !== 'table' && !modules.views?.[l] ? t('This view is not available yet.') : ''}
          onClick=${() => setLayout(l)}>${t({ table: 'Table', cards: 'Cards', heatmap: 'Heatmap' }[l])}</button>`)}</div>
    </div>
    <div class="bulkhost" ref=${bulkHost}></div>
    ${layout !== 'table' && modules.views?.[layout] ? html`<div class="viewhost" ref=${viewHost}></div>` : html`
    <div class="tscroll"><table class="pt">
      <thead><tr>
        <th class="cb"><input type="checkbox" class="pcb" aria-label=${t('Select all')} checked=${allChecked}
          onChange=${(e) => setSelected(e.target.checked ? new Set(rows.map((s) => s.site_id)) : new Set())} /></th>
        <th class=${'sortable' + (sort.id === 'name' ? ' sorted' : '')} onClick=${() => sortBy('name')}>${t('Site')}${sort.id === 'name' ? (sort.dir === 'desc' ? ' ↓' : ' ↑') : ''}</th>
        ${visibleCols.map((id) => { const c = COL_BY[id]; return html`<th class=${[c.num ? 'num' : '', c.sort ? 'sortable' : '', sort.id === id ? 'sorted' : ''].join(' ')}
          aria-sort=${sort.id === id ? (sort.dir === 'asc' ? 'ascending' : 'descending') : undefined}
          onClick=${c.sort ? () => sortBy(id) : undefined}>${t(c.label)}${sort.id === id ? (sort.dir === 'desc' ? ' ↓' : ' ↑') : ''}</th>`; })}
      </tr></thead>
      <tbody>
        ${rows.map((s, i) => html`<tr key=${s.site_id} class=${(i === focus ? 'focus ' : '') + (selected.has(s.site_id) ? 'sel' : '')} onClick=${() => { setFocus(i); openSite(s); }}>
          <td class="cb" onClick=${(e) => e.stopPropagation()}><input type="checkbox" class="pcb" aria-label=${t('Select') + ' ' + s.name} checked=${selected.has(s.site_id)} onChange=${() => toggleSel(s.site_id)} /></td>
          <td><div class="site"><${Raw} h=${ui.avatar(s.name)} /><div>
            <div><span class="nm"><a href=${'/site.html?id=' + encodeURIComponent(s.site_id)} onClick=${(e) => { if (!e.metaKey && !e.ctrlKey) { e.preventDefault(); e.stopPropagation(); setFocus(i); openSite(s); } }}>${s.name}</a></span>
              ${s.starred ? html` <span class="star" aria-label=${t('Starred')}>★</span>` : null}
              ${s.tags.slice(0, 2).map((g) => html`<span class="ptag">${g}</span>`)}${s.tags.length > 2 ? html`<span class="ptag">+${s.tags.length - 2}</span>` : null}</div>
            <div class="dm">${s.domains[0] || s.site_id}${s.domains.length > 1 ? ' +' + (s.domains.length - 1) : ''}</div></div></div></td>
          ${visibleCols.map((id) => { const c = COL_BY[id]; return html`<td class=${(c.num ? 'num ' : '') + (c.cls || '')}><${Raw} h=${c.render(s, { th })} /></td>`; })}
        </tr>`)}
        ${rows.length === 0 ? html`<tr><td colspan=${visibleCols.length + 2} class="loading-state">${t('No sites match this view.')}</td></tr>` : null}
      </tbody>
    </table></div>`}
    <div class="note">${fill(t(rows.length === 1 ? '{n} site' : '{n} sites'), { n: rows.length })}${selected.size ? ' · ' + fill(t('{n} selected'), { n: selected.size }) : ''} · ${t('j / k to move, Enter to open, x to select, / or ⌘K to jump to a site.')}</div>
  </section>`;

  const title = tab === 'sites' && view === 'attention' ? t('Needs attention') : tab === 'sites' && view === 'starred' ? t('Starred') : t('Portfolio overview');
  return html`
    <main class="pf" aria-busy=${data._stale ? 'true' : 'false'} style=${data._stale ? 'opacity:.6;transition:opacity .2s' : ''}>
      <h1 class="title">${title}</h1>
      ${sites.length === 0 ? html`
        <div class="p-card empty-state">
          <${Icon} n="globe" />
          <h2>${t('No sites yet')}</h2>
          <p>${t('Add your first site to get its tracking snippet. Numbers appear here as soon as it receives a visit.')}</p>
          <button class="p-btn primary" onClick=${openAdd}><${Icon} n="plus" />${t('New site')}</button>
          <p style="margin-top:14px;font-size:13px">${t('Just deployed?')} <a href="/health.html">${t('Run the self-check ↗')}</a></p>
        </div>` : html`
      <div class="utabs" role="tablist">
        ${TABS.map((k) => html`<button type="button" role="tab" aria-selected=${tab === k} class=${tab === k ? 'on' : ''} onClick=${() => { setTab(k); if (k === 'overview') setView('all'); }}>${t({ overview: 'Overview', sites: 'Sites', lifecycle: 'Lifecycle' }[k])}</button>`)}
      </div>
      ${Toolbar}
      ${cols.join(',') === PRESETS.experiments.join(',') && tab === 'sites' ? html`<div class="p-card banner"><${Icon} n="flask" /><div><b>${t('Experiments')}</b>
        <p>${t('Experiments are per site — open a site to see them.')}</p></div></div>` : null}
      ${allSetup ? html`<div class="p-card banner"><${Icon} n="code" /><div><b>${fill(t('{n} sites are waiting for their first visit'), { n: counts.all })}</b>
        <p>${t('Embed the snippet on each site (open a site for its snippet). Stages, trends and crawl signals fill in as data arrives.')}</p></div></div>` : null}
      ${tab === 'overview' ? html`
        <div class="caption">${fill(t(compare ? '{n} sites, totals for {period}, compared with the previous period. Bots and crawlers excluded.' : '{n} sites, totals for {period}. Bots and crawlers excluded.'), { n: activeScope.length, period: periodLabel.toLowerCase() })}
          ${' '}<button type="button" onClick=${() => setCompare(!compare)}>${t(compare ? 'Hide comparison' : 'Compare with previous period')}</button></div>
        <section class="kpis" aria-label=${t('Totals')}>
          <${Kpi} icon="eye" label=${t('Visitors')} value=${fmt.num(T.uv)} delta=${dPct(T.uv, T.uv_prev)} />
          <${Kpi} icon="page" label=${t('Pageviews')} value=${fmt.compact(T.pv)} delta=${dPct(T.pv, T.pv_prev)} />
          <${Kpi} icon="search" label=${t('Organic search')} value=${fmt.num(T.organic_uv)} delta=${dPct(T.organic_uv, T.organic_uv_prev)} />
          <${Kpi} icon="spark" label=${t('From AI assistants')} value=${fmt.num(T.ai_uv)} delta=${dPct(T.ai_uv, T.ai_uv_prev)} />
          <${Kpi} icon="ivt" label=${t('Invalid traffic')} value=${fmt.pct(T.ivt_pct, 1)} delta=${ivtD} />
        </section>
        ${Lifecycle}${Chart}${TableCard}` : tab === 'lifecycle' ? html`${Lifecycle}${Funnel}${TableCard}` : TableCard}
      `}
    </main>`;
}

// ── add-site modal (kept flow: template picker + snippet) ────────────────
const dlg = document.getElementById('addDlg');
const $ = (id) => document.getElementById(id);
const TZ_LIST = (() => {
  try { return Intl.supportedValuesOf('timeZone'); } catch {
    return ['UTC', 'Asia/Shanghai', 'Asia/Hong_Kong', 'Asia/Tokyo', 'Asia/Singapore', 'Asia/Kolkata', 'Europe/London', 'Europe/Paris', 'Europe/Berlin',
      'America/New_York', 'America/Chicago', 'America/Los_Angeles', 'America/Sao_Paulo', 'Australia/Sydney'];
  }
})();
const browserTz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return 'UTC'; } })();
let me = null, templates = [];
async function prepAdd() {
  if (!me) {
    $('tzlist').innerHTML = TZ_LIST.map((z) => `<option value="${esc(z)}"></option>`).join('');
    try { me = await (await guard(await fetch('/api/me'))).json(); } catch { me = {}; }
    try { templates = ((await (await guard(await fetch('/api/templates'))).json()).templates) || []; } catch { templates = []; }
    $('tpl').innerHTML = `<option value="">${te('No template')}</option>` + templates.map((x) => `<option value="${esc(x.template_id)}">${esc(x.name)}</option>`).join('');
    $('tpl').closest('div').hidden = !templates.length;
  }
  const def = me.timezone && me.timezone !== 'UTC' ? me.timezone : (TZ_LIST.includes(browserTz) ? browserTz : 'UTC');
  if (!$('tz').value) $('tz').value = def;
}
function openAdd() {
  $('create').hidden = false; $('snippet').hidden = true; $('err').textContent = '';
  prepAdd();
  I18N.applyStatic(dlg);
  dlg.showModal();
  setTimeout(() => $('name').focus(), 0);
}
window.pvuvOpenAdd = openAdd;
$('tpl').addEventListener('change', () => {
  const x = templates.find((y) => y.template_id === $('tpl').value);
  if (!x) return;
  if (x.timezone) $('tz').value = x.timezone;
  if (x.adguard_mode) $('agmode').value = x.adguard_mode;
  $('adclient').value = x.adclient || '';
  if (x.engaged_seconds != null) $('engaged').value = x.engaged_seconds;
});
dlg.addEventListener('click', (e) => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); });
dlg.addEventListener('close', () => { if (!$('snippet').hidden) document.dispatchEvent(new CustomEvent('pvuv:changed')); });
$('addAnother').addEventListener('click', () => { $('create').reset(); $('tz').value = ''; prepAdd(); $('create').hidden = false; $('snippet').hidden = true; $('name').focus(); document.dispatchEvent(new CustomEvent('pvuv:changed')); });
$('copySnippet').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('snippetCode').textContent); $('copySnippet').textContent = t('Copied'); } catch { /* no clipboard */ } });
$('create').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    name: $('name').value,
    domains: $('domains').value.split(',').map((d) => d.trim()).filter(Boolean),
    adguard_mode: $('agmode').value,
    adclient: $('adclient').value.trim() || undefined,
    timezone: $('tz').value,
    engaged_seconds: parseInt($('engaged').value, 10) || 15,
  };
  if ($('tpl').value) body.template = $('tpl').value;
  const r = await guard(await fetch('/api/sites', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }));
  const d = await r.json();
  if (!r.ok) { $('err').textContent = d.error || t('failed'); return; }
  $('err').textContent = '';
  // f.js is served by this console; events go to the ingest host (deployment
  // config INGEST_HOST, sibling-subdomain guess only for older deployments)
  const ingestHost = (me && me.ingest_host) || 'in.' + location.hostname.replace(/^(www|console)\./, '');
  const attrs = [`data-site="${d.site_id}"`, `data-api="https://${ingestHost}"`];
  if (d.adguard_mode !== 'off') attrs.push(`data-adguard="${d.adguard_mode}"`);
  if (d.adclient) attrs.push(`data-adclient="${d.adclient}"`);
  $('snippetCode').textContent = `<script defer src="${location.origin}/f.js"\n        ${attrs.join('\n        ')}><\/script>`;
  $('copySnippet').textContent = t('Copy');
  $('create').hidden = true; $('snippet').hidden = false;
});

I18N.applyStatic();
const root = document.getElementById('app');
root.textContent = '';
render(html`<${App} />`, root);
if (new URLSearchParams(location.search).get('new') === '1') {
  const u = new URLSearchParams(location.search); u.delete('new');
  history.replaceState(null, '', location.pathname + (u.toString() ? '?' + u : ''));
  openAdd();
}
</script>
</body>
</html>
