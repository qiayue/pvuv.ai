<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}}</title>
<meta name="description" content="{{description}}">
<!--
  Default homepage for a self-hosted pvuv.ai deployment.

  {{name}} / {{description}} are filled in server-side from the instance
  settings (console → Sites → Homepage settings). For a fully custom page,
  create workers/console/public/home.html (gitignored) instead — it replaces
  this page entirely on deploy. See DEPLOY.md "Customize the homepage".

  Deliberately minimal and generic: thousands of deployments shipping
  identical rich landing copy would be duplicate content in search engines.
  The footer carries an optional courtesy "Powered by pvuv.ai" link — MIT
  imposes no attribution requirement, so keep it to support the project or
  remove it freely (see README "Attribution (optional)").
-->
<link rel="stylesheet" href="/console.css">
<style>
  body { font-size: 16px; line-height: 1.6; min-height: 100vh; display: grid; grid-template-rows: 1fr auto; }
  main { display: grid; place-items: center; padding: 40px 16px; margin: 0 auto; }
  .box { max-width: 480px; text-align: center; }
  h1 { font-size: 26px; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 26px; }
  a.btn.big { padding: 10px 26px; min-height: 42px; font-size: 15px; border-radius: var(--radius); }
  footer { padding: 18px; text-align: center; font-size: 12.5px; color: var(--muted); border-top: 1px solid #1d222c; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="box">
    <h1>{{name}}</h1>
    <p>{{description}}</p>
    <a class="btn primary big" href="/login.html">Sign in</a>
  </div>
</main>
<footer>
  Powered by <a href="https://pvuv.ai">pvuv.ai</a> ·
  <a href="https://github.com/qiayue/pvuv.ai">open source</a>
</footer>
</body>
</html>
